    <script>
        // Terms checkbox functionality for gym booking page
        document.addEventListener('DOMContentLoaded', function() {
            const checkboxPayment = document.getElementById('terms-payment');
            const buttonPayment = document.getElementById('btn-payment');
            const checkboxBooking = document.getElementById('terms-booking');
            const buttonBooking = document.getElementById('btn-booking');

            if (checkboxPayment && buttonPayment) {
                checkboxPayment.addEventListener('change', function() {
                    buttonPayment.disabled = !this.checked;
                });
            }

            if (checkboxBooking && buttonBooking) {
                checkboxBooking.addEventListener('change', function() {
                    buttonBooking.disabled = !this.checked;
                });
            }
        });

        // Payment button handler
        function handlePayment() {
            alert('Redirecting to payment gateway... ₹1699 for Velocity Gym Membership');
            // In a real application, this would redirect to a payment gateway
            // window.location.href = 'payment-gateway-url';
        }
        
        // Form submission
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const timeSelect = document.getElementById('timeSelect');
            if (!timeSelect.value) {
                alert('Please select a preferred time');
                return;
            }
            
            // Show success message
            document.getElementById('successMessage').style.display = 'block';
            
            // Reset form
            this.reset();
            
            // Hide success message after 5 seconds
            setTimeout(() => {
                document.getElementById('successMessage').style.display = 'none';
            }, 5000);
        });
        
        // Set minimum date to today
        const dateInput = document.querySelector('input[type="date"]');
        const today = new Date().toISOString().split('T')[0];
        dateInput.min = today;
    </script>

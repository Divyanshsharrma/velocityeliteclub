<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Pool Session - Velocity Pool</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .booking-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #000 0%, #0a0a0a 50%, #000 100%);
            padding: 40px 20px;
        }
        
        .booking-header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInUp 1s ease-out;
        }
        
        .booking-title {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 700;
            color: #00d4ff;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }
        
        .booking-subtitle {
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 2rem;
        }
        
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: #00d4ff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 30px;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .back-button:hover {
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
            transform: translateX(-5px);
        }
        
        .booking-container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.1);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        .discount-section {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(0, 153, 255, 0.1));
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
        }
        
        .discount-badge {
            background: linear-gradient(45deg, #00d4ff, #0099ff);
            color: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 15px;
            display: inline-block;
        }
        
        .discount-count {
            display: block;
            font-size: 0.7rem;
            margin-top: 5px;
            opacity: 0.9;
        }
        
        .discount-pricing {
            margin: 20px 0;
        }
        
        .original-price {
            font-size: 1.2rem;
            color: #666;
            text-decoration: line-through;
            margin-bottom: 5px;
        }
        
        .discount-price {
            font-size: 2.5rem;
            font-weight: 700;
            color: #00d4ff;
            margin-bottom: 5px;
            font-family: 'Oswald', sans-serif;
        }
        
        .savings {
            font-size: 0.9rem;
            color: #4ade80;
            font-weight: 600;
        }
        
        .discount-features {
            margin-top: 20px;
        }
        
        .feature-item {
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 8px;
            text-align: left;
        }
        
        .payment-button {
            background: linear-gradient(45deg, #00d4ff, #0099ff);
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s ease;
            margin-top: 20px;
            width: 100%;
        }
        
        .payment-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }
        
        .booking-form {
            display: grid;
            gap: 20px;
        }
        
        .form-group {
            display: grid;
            gap: 10px;
        }
        
        .form-label {
            color: #00d4ff;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.9rem;
        }
        
        .form-input, .form-select {
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: #fff;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }
        
        .form-input::placeholder {
            color: #666;
        }
        
        .form-select option {
            background: #000;
            color: #fff;
        }
        
        .submit-button {
            background: linear-gradient(45deg, #00d4ff, #0099ff);
            color: #fff;
            border: none;
            padding: 20px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        
        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.4);
        }
        
        .pool-showcase {
            margin-bottom: 60px;
            text-align: center;
        }
        
        .pool-image {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.2);
            margin-bottom: 30px;
        }
        
        .success-message {
            display: none;
            background: linear-gradient(45deg, #00d4ff, #0099ff);
            color: #fff;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-weight: 600;
            margin-top: 20px;
            animation: fadeInUp 0.5s ease-out;
        }
        
        @media (max-width: 768px) {
            .booking-container {
                padding: 30px 20px;
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .discount-section {
                padding: 20px;
            }
            
            .discount-price {
                font-size: 2rem;
            }
            
            .pool-image {
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="booking-page">
        <div class="booking-header">
            <a href="index.html" class="back-button">← Back to Home</a>
            <h1 class="booking-title">Book Your Pool Session</h1>
            <p class="booking-subtitle">Experience luxury swimming at Velocity Pool</p>
        </div>
        
        <div class="pool-showcase">
            <img src="swimming pool.jpeg" alt="Velocity Swimming Pool" class="pool-image">
        </div>
        
        <div class="booking-container">
            <!-- Pool Discount Section -->
            <div class="discount-section">
                <div class="discount-badge">
                    <span class="discount-text">POOL MEMBERSHIP</span>
                    <span class="discount-count">Premium Experience</span>
                </div>
                <div class="discount-features">
                    <div class="feature-item">✓ Unlimited Pool Access</div>
                    <div class="feature-item">✓ Professional Coaching</div>
                    <div class="feature-item">✓ Premium Facilities</div>
                    <div class="feature-item">✓ Locker & Shower</div>
                </div>
                <button class="payment-button" onclick="handlePoolPayment()">Proceed to Payment</button>
            </div>
            
            <form class="booking-form" id="poolBookingForm">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-input" placeholder="Enter your full name" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-input" placeholder="+91 98765 43210" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Preferred Date</label>
                    <input type="date" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Preferred Time</label>
                    <select class="form-select" id="poolTimeSelect" required>
                        <option value="">Select preferred time</option>
                        <option value="6:00 AM">6:00 AM</option>
                        <option value="7:00 AM">7:00 AM</option>
                        <option value="8:00 AM">8:00 AM</option>
                        <option value="9:00 AM">9:00 AM</option>
                        <option value="10:00 AM">10:00 AM</option>
                        <option value="11:00 AM">11:00 AM</option>
                        <option value="4:00 PM">4:00 PM</option>
                        <option value="5:00 PM">5:00 PM</option>
                        <option value="6:00 PM">6:00 PM</option>
                        <option value="7:00 PM">7:00 PM</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Session Type</label>
                    <select class="form-select" required>
                        <option value="">Select session type</option>
                        <option value="lap-swimming">Lap Swimming</option>
                        <option value="recreational">Recreational Swim</option>
                        <option value="aqua-fitness">Aqua Fitness</option>
                        <option value="swimming-lessons">Swimming Lessons</option>
                        <option value="family-swim">Family Swim Time</option>
                    </select>
                </div>
                
                <button type="submit" class="submit-button">Book Pool Session</button>
                
                <div class="success-message" id="poolSuccessMessage">
                    🏊 Your pool session has been booked! We'll contact you soon.
                </div>
            </form>
        </div>
    </div>
    
    <script>
        // Pool payment button handler
        function handlePoolPayment() {
            alert('Redirecting to payment gateway... for Velocity Pool Membership');
            // In a real application, this would redirect to a payment gateway
            // window.location.href = 'pool-payment-gateway-url';
        }
        
        // Pool form submission
        document.getElementById('poolBookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const poolTimeSelect = document.getElementById('poolTimeSelect');
            if (!poolTimeSelect.value) {
                alert('Please select a preferred time');
                return;
            }
            
            // Show success message
            document.getElementById('poolSuccessMessage').style.display = 'block';
            
            // Reset form
            this.reset();
            
            // Hide success message after 5 seconds
            setTimeout(() => {
                document.getElementById('poolSuccessMessage').style.display = 'none';
            }, 5000);
        });
        
        // Set minimum date to today
        const poolDateInput = document.querySelector('input[type="date"]');
        const today = new Date().toISOString().split('T')[0];
        poolDateInput.min = today;
    </script>
</body>
</html>
